services:
  db:
    image: postgis/postgis:17-3.4
    network_mode: "host"
    restart: always
    container_name: 'postgres'
    environment:
        POSTGRES_PASSWORD: ''
        POSTGRES_USER: 'eis'
        POSTGRES_HOST_AUTH_METHOD: 'trust'
        PGPORT: 6432
    volumes:
      - ./postgres-data:/var/lib/postgresql/data      
  entropiainventoryshareweb:
    image: ${DOCKER_REGISTRY-}entropiainventoryshareweb
    build:
      context: .
      dockerfile: EntropiaInventoryShareWeb/Dockerfile
